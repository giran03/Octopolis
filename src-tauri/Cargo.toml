[package]
name = "octopolis"
description = "Octopolis file explorer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "octopolis_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
dirs = "7.0.0"
notify = "8.2.2"
octo-core = { path = "../crates/octo-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }

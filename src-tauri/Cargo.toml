[package]
name = "octopolis"
description = "Octopolis file explorer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "octopolis_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
blake3 = "1.8.7"
dirs = "7.0.0"
notify = "8.2.2"
rayon = "1.12.0"
octo-core = { path = "../crates/octo-core" }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tauri = { version = "2.12.5", features = ["tray-icon"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
tauri-plugin-single-instance = "2"
jiff = "0.2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri uses; reaches the WebView2 memory target while the window is hidden.
webview2-com = "0.39"
windows-core = "0.62"

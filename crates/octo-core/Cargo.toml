[package]
name = "octo-core"
description = "UI-independent file system engine for Octopolis"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
bzip2 = "0.6.1"
flate2 = "1.1.11"
gix = { version = "0.90.0", default-features = false, features = ["status", "revision", "index", "dirwalk", "sha1", "parallel"] }
id3 = "1.17.3"
jiff = "0.2.42"
kamadak-exif = "0.6.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
md-5 = "0.10"
memchr = "2"
nucleo-matcher = "0.3.1"
png = "0.18.1"
pulldown-cmark = "0.13.6"
rayon = "1.12.0"
regex = "1.13.1"
sevenz-rust2 = "0.25.0"
sha2 = "0.10"
tar = "0.4.46"
thiserror = "2.0.21"
trash = "5.3.0"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.27.2"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
zip = { version = "9.5.1", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd", "lzma", "time"] }

[target.'cfg(windows)'.dependencies]
junction = "2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"

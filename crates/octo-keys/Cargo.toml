[package]
name = "octopolis-keys"
description = "Octopolis's Win+E helper: catches Win+E while Octopolis isn't running"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "octopolis-keys"
path = "src/main.rs"

[dependencies]
octo-core = { path = "../octo-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
